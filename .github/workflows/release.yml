name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Upgrade npm for OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Verify tag matches package.json version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)." >&2
            exit 1
          fi
          if [[ "$PKG_VERSION" == *-* ]]; then
            DIST_TAG="beta"
          else
            DIST_TAG="latest"
          fi
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "Validated version $PKG_VERSION (dist-tag: $DIST_TAG)"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Prepack
        run: npm run prepack

      - name: Publish to npm with OIDC provenance
        run: npm publish --provenance --access public --tag "${{ steps.version.outputs.dist_tag }}"
